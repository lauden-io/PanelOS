[package]
name = "nspanel-app"
version = "0.0.8"
edition = "2021"
description = "Native Home Assistant panel app for the Sonoff NSPanel Pro 86"
publish = false
# Slint is used under its GPLv3 option (its royalty-free licence excludes
# embedded systems); GPLv3 section 13 allows the combination.
license = "AGPL-3.0-or-later"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "compat-1-2",
    "std",
    "renderer-software",
    "software-renderer-systemfonts",
] }
# PNG and JPEG decoding for the pictures read at run time (the GPU renderer turns it on
# itself; the software renderer of the image's own app needs it too).
i-slint-core = { version = "=1.18.1", default-features = false, features = ["image-decoders"] }
drm = "0.15"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { version = "2.12", default-features = false }
# ureq's own URL parser: an address is checked the way ureq will read it
url = "2.5"
qrcode = { version = "0.14", default-features = false }
jpeg-decoder = { version = "0.3", default-features = false }
# Pictures of the screen for the PanelOS page in Home Assistant
png = "0.18"
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
prost = "0.14"
# MP3 announcements from Home Assistant (pure Rust, no unsafe code)
symphonia-core = "0.6"
symphonia-bundle-mp3 = "0.6"
alsa = "0.12"
# ESPHome API encryption (Noise_NNpsk0_25519_ChaChaPoly_SHA256)
snow = "=0.9.6"
# Sendspin player (Music Assistant): PSK ids, base64url identities
sha2 = "0.10"
base64 = "0.22"
# GPU renderer (feature "gpu"): Skia on OpenGL ES through EGL on a GBM surface.
# The Skia renderer crate is Slint's own (same version as slint, pinned).
i-slint-renderer-skia = { version = "=1.18.1", default-features = false, features = ["opengl"], optional = true }
gbm = { version = "0.18", default-features = false, features = ["drm-support"], optional = true }
drm014 = { package = "drm", version = "0.14", optional = true }
glutin = { version = "0.32", default-features = false, features = ["egl"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
glow = { version = "0.18", optional = true }
# The pictures the app draws itself (label tapes, handwriting): the renderer's own Skia.
skia-safe = { version = "=0.153.3", default-features = false, features = ["gl"], optional = true }

[features]
default = []
# The UI on the GPU (Mesa from the web bundle); without it the software renderer draws.
gpu = ["dep:i-slint-renderer-skia", "dep:gbm", "dep:drm014", "dep:glutin", "dep:raw-window-handle", "dep:glow", "dep:skia-safe"]

[build-dependencies]
slint-build = "1.18"
cc = "1"
prost-build = "0.14"
protox = "0.10"

[profile.release]
strip = true
lto = "thin"

# Slint's Skia renderer with two small changes (app/vendor/README.md).
[patch.crates-io]
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
